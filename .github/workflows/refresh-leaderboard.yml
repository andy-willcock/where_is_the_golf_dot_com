name: Refresh PGA Leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 12-23 * * 0,4,5,6"

permissions:
  contents: write

concurrency:
  group: pga-leaderboard-refresh
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Collect Top 15 leaderboard
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python leaderboard.py

      - name: Validate leaderboard snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/leaderboard.json").read_text())
          players = data.get("players", [])

          print("Tournament:", data.get("tournament"))
          print("Updated:", data.get("updatedUtc"))
          print("Rows:", len(players))

          if len(players) != 15:
              raise SystemExit(
                  f"Expected 15 leaderboard rows, got {len(players)}"
              )
          PY

      - name: Commit leaderboard
        run: |
          if git diff --quiet -- data/leaderboard.json; then
            echo "Leaderboard did not change."
            exit 0
          fi

          git config user.name "whereisthegolf-leaderboard-bot"
          git config user.email "whereisthegolf-leaderboard-bot@users.noreply.github.com"

          git add data/leaderboard.json
          git commit -m "Update PGA TOUR leaderboard"
          git push
